<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUX-Ω v7 — Estúdio Uncensored (Imagem & Vídeo)</title>
  <style>
    :root {
      --bg: #121215;
      --panel: #1b1b20;
      --card: #23232a;
      --border: #32323c;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #8b5cf6;
      --accent-2: #ec4899;
      --ok: #10b981;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .brand { font-weight: 700; font-size: 1.05rem; display: flex; align-items: center; gap: 10px; }
    .badge {
      font-size: 0.75rem;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(139, 92, 246, 0.18);
      color: #c4b5fd;
      border: 1px solid rgba(139, 92, 246, 0.4);
    }
    .controls-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    input, select, textarea, button {
      font-family: inherit;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 9px 12px;
      font-size: 0.9rem;
    }
    button {
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border: none;
      font-weight: 600;
    }
    button.secondary { background: var(--card); border: 1px solid var(--border); }
    main {
      max-width: 1120px;
      margin: 24px auto;
      padding: 0 18px 40px;
      display: grid;
      gap: 18px;
    }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .tab-btn.active { outline: 2px solid var(--accent); }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    label { font-size: 0.82rem; color: var(--muted); display: block; margin-bottom: 4px; }
    textarea { min-height: 96px; width: 100%; resize: vertical; }
    .row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    img, video {
      max-width: 100%;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #0b0b0d;
    }
    pre {
      margin: 0;
      padding: 12px;
      border-radius: 10px;
      background: #0d0d10;
      border: 1px solid var(--border);
      color: #d1d5db;
      font-size: 0.8rem;
      overflow-x: auto;
      white-space: pre-wrap;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>LUX-Ω v7 Uncensored</span>
      <span class="badge">Imagem + Vídeo (ComfyUI / Diffusers)</span>
    </div>
    <div class="controls-top">
      <input id="apiUrlInput" type="text" placeholder="https://xxxx.trycloudflare.com" style="min-width: 260px;" />
      <button class="secondary" onclick="syncNtfy()">📡 Sincronizar ntfy</button>
      <button class="secondary" onclick="checkHealth()">🩺 Status</button>
    </div>
  </header>

  <main>
    <div class="tabs">
      <button id="tab-img" class="tab-btn active" onclick="switchTab('img')">🖼️ Gerador de Imagem Uncensored</button>
      <button id="tab-vid" class="tab-btn secondary" onclick="switchTab('vid')">🎬 Gerador de Vídeo Uncensored</button>
      <button id="tab-god" class="tab-btn secondary" onclick="switchTab('god')">⚡ /GOD & JSON</button>
    </div>

    <section id="panel-img" class="grid-2">
      <div class="card">
        <h3>Gerador de Imagem Uncensored</h3>
        <div>
          <label>Preset Realista / Detalhe</label>
          <select id="imgPreset" onchange="applyImagePreset()">
            <option value="">Personalizado (sem filtro de prompt)</option>
            <option value="raw 4k photograph, natural lighting, realistic skin and fabric texture, shallow depth of field, 35mm lens">4K Realista + Iluminação Natural + Profundidade</option>
            <option value="golden hour sunlight, warm natural shadows, crisp focus, high detail">Luz Dourada Natural</option>
            <option value="editorial studio portrait, soft key light, realistic pores and hair strands, f/1.8">Retrato de Estúdio</option>
          </select>
        </div>
        <div>
          <label>Prompt (sem restrição de filtro)</label>
          <textarea id="imgPrompt" placeholder="Descreva a imagem em detalhes..."></textarea>
        </div>
        <div>
          <label>Modelo HuggingFace / Checkpoint (opcional)</label>
          <input id="imgModel" type="text" placeholder="Ex.: stabilityai/sdxl-turbo ou ID uncensored" />
        </div>
        <div class="row">
          <div>
            <label>Largura</label>
            <input id="imgWidth" type="number" value="1024" />
          </div>
          <div>
            <label>Altura</label>
            <input id="imgHeight" type="number" value="1024" />
          </div>
        </div>
        <div class="row">
          <div>
            <label>Steps</label>
            <input id="imgSteps" type="number" value="4" />
          </div>
          <div>
            <label>Guidance Scale</label>
            <input id="imgCfg" type="number" step="0.1" value="0.0" />
          </div>
        </div>
        <button onclick="generateImage()">🎨 Gerar Imagem Uncensored</button>
      </div>

      <div class="card">
        <h3>Resultado da Imagem</h3>
        <img id="imgPreview" class="hidden" alt="Imagem gerada" />
        <pre id="imgLog">Aguardando geração...</pre>
      </div>
    </section>

    <section id="panel-vid" class="grid-2 hidden">
      <div class="card">
        <h3>Gerador de Vídeo Uncensored (ComfyUI / Wan 2.2 / Diffusers)</h3>
        <div>
          <label>Prompt de Vídeo</label>
          <textarea id="vidPrompt" placeholder="Descreva o movimento, câmera, cena e iluminação..."></textarea>
        </div>
        <div>
          <label>Modelo de Vídeo (opcional — usa Wan 2.2 no ComfyUI 8188 se vazio)</label>
          <input id="vidModel" type="text" placeholder="Ex.: Wan-AI/Wan2.1-T2V-1.3B-Diffusers" />
        </div>
        <div class="row">
          <div>
            <label>Frames (4n+1 no Wan)</label>
            <input id="vidFrames" type="number" value="25" />
          </div>
          <div>
            <label>FPS</label>
            <input id="vidFps" type="number" value="16" />
          </div>
        </div>
        <div class="row">
          <div>
            <label>Largura</label>
            <input id="vidWidth" type="number" value="512" />
          </div>
          <div>
            <label>Altura</label>
            <input id="vidHeight" type="number" value="320" />
          </div>
        </div>
        <button onclick="generateVideo()">🎥 Gerar Vídeo Uncensored</button>
      </div>

      <div class="card">
        <h3>Resultado do Vídeo</h3>
        <video id="vidPreview" class="hidden" controls></video>
        <pre id="vidLog">Aguardando geração...</pre>
      </div>
    </section>

    <section id="panel-god" class="card hidden">
      <h3>Comando /GOD & Diagnóstico</h3>
      <textarea id="godCmd" placeholder="Ex.: nvidia-smi && ls -la /content/outputs"></textarea>
      <button onclick="runGod()">⚡ Executar /GOD</button>
      <pre id="godLog">Pronto.</pre>
    </section>
  </main>

  <script>
    const NTFY_CHANNEL = "lux-omega-kauan-v55";
    const apiInput = document.getElementById("apiUrlInput");
    apiInput.value = localStorage.getItem("lux_api_url") || "";
    apiInput.addEventListener("change", () => localStorage.setItem("lux_api_url", apiInput.value.trim()));

    function getApiBase() {
      const val = (apiInput.value || "").trim().replace(/\/+$/, "");
      if (!val) throw new Error("Informe ou sincronize a URL da API do Colab.");
      return val;
    }

    function switchTab(name) {
      ["img", "vid", "god"].forEach(k => {
        document.getElementById("panel-" + k).classList.toggle("hidden", k !== name);
        const btn = document.getElementById("tab-" + k);
        btn.classList.toggle("active", k === name);
        btn.classList.toggle("secondary", k !== name);
      });
    }

    function applyImagePreset() {
      const preset = document.getElementById("imgPreset").value;
      const box = document.getElementById("imgPrompt");
      if (preset && !box.value.includes(preset)) {
        box.value = box.value.trim() ? `${box.value.trim()}, ${preset}` : preset;
      }
    }

    async function syncNtfy() {
      try {
        const res = await fetch(`https://ntfy.sh/${NTFY_CHANNEL}/json?poll=1&since=2h`);
        const text = await res.text();
        const lines = text.trim().split("
").filter(Boolean).reverse();
        for (const line of lines) {
          const obj = JSON.parse(line);
          if (obj.event === "message" && obj.message) {
            try {
              const payload = JSON.parse(obj.message);
              if (payload.api_url || payload.api) {
                apiInput.value = payload.api_url || payload.api;
                localStorage.setItem("lux_api_url", apiInput.value);
                await checkHealth();
                return;
              }
            } catch (_) {}
          }
        }
        alert("Nenhuma URL publicada recentemente no canal ntfy.sh.");
      } catch (e) {
        alert("Erro ao sincronizar ntfy: " + e.message);
      }
    }

    async function checkHealth() {
      try {
        const base = getApiBase();
        const res = await fetch(`${base}/status`);
        const data = await res.json();
        document.getElementById("godLog").textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        document.getElementById("godLog").textContent = "Erro: " + e.message;
      }
    }

    async function generateImage() {
      const log = document.getElementById("imgLog");
      const preview = document.getElementById("imgPreview");
      log.textContent = "Gerando imagem uncensored...";
      try {
        const base = getApiBase();
        const body = {
          modo: "uncensored_image",
          prompt: document.getElementById("imgPrompt").value,
          model: document.getElementById("imgModel").value || null,
          params: {
            width: Number(document.getElementById("imgWidth").value || 1024),
            height: Number(document.getElementById("imgHeight").value || 1024),
            steps: Number(document.getElementById("imgSteps").value || 4),
            guidance_scale: Number(document.getElementById("imgCfg").value || 0.0)
          }
        };
        const res = await fetch(`${base}/executar`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.image_base64) {
          preview.src = "data:image/png;base64," + data.image_base64;
          preview.classList.remove("hidden");
        } else if (data.image_url) {
          preview.src = data.image_url;
          preview.classList.remove("hidden");
        }
        const { image_base64, ...meta } = data;
        log.textContent = JSON.stringify({ ...meta, has_image_base64: Boolean(image_base64) }, null, 2);
      } catch (e) {
        log.textContent = "Erro: " + e.message;
      }
    }

    async function generateVideo() {
      const log = document.getElementById("vidLog");
      const preview = document.getElementById("vidPreview");
      log.textContent = "Gerando vídeo uncensored...";
      try {
        const base = getApiBase();
        const body = {
          modo: "uncensored_video",
          prompt: document.getElementById("vidPrompt").value,
          model: document.getElementById("vidModel").value || null,
          params: {
            frames: Number(document.getElementById("vidFrames").value || 25),
            fps: Number(document.getElementById("vidFps").value || 16),
            width: Number(document.getElementById("vidWidth").value || 512),
            height: Number(document.getElementById("vidHeight").value || 320)
          }
        };
        const res = await fetch(`${base}/executar`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.video_base64) {
          preview.src = "data:video/mp4;base64," + data.video_base64;
          preview.classList.remove("hidden");
        } else if (data.video_url) {
          preview.src = data.video_url;
          preview.classList.remove("hidden");
        }
        const { video_base64, ...meta } = data;
        log.textContent = JSON.stringify({ ...meta, has_video_base64: Boolean(video_base64) }, null, 2);
      } catch (e) {
        log.textContent = "Erro: " + e.message;
      }
    }

    async function runGod() {
      const log = document.getElementById("godLog");
      log.textContent = "Executando comando /GOD...";
      try {
        const base = getApiBase();
        const res = await fetch(`${base}/executar`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            modo: "god",
            prompt: document.getElementById("godCmd").value,
            params: { command: document.getElementById("godCmd").value }
          })
        });
        const data = await res.json();
        log.textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        log.textContent = "Erro: " + e.message;
      }
    }
  </script>
</body>
</html>
